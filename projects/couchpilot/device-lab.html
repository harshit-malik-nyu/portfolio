<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CouchPilot · Device layout lab</title><link rel="stylesheet" href="style.css"><style>main{padding:30px;max-width:none}.lab-frame{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:24px 0;background:#090e15;padding:14px}iframe{display:block;border:0;background:var(--bg)}.presets{display:flex;gap:10px;flex-wrap:wrap}.lab-note{max-width:760px}button[aria-pressed=true]{border-color:var(--mint);color:var(--mint)}</style></head><body><main><p class="eyebrow">COUCHPILOT / RESPONSIVE VERIFICATION</p><h1>One journey. Different screens.</h1><p class="lab-note">Inspect the real app inside fixed browser viewports. These are CSS layout checks, not physical device, remote-control, speech or accessibility certification.</p><div class="presets" aria-label="Viewport presets"><button data-size="360,800" aria-pressed="true">Phone · 360 × 800</button><button data-size="768,1024" aria-pressed="false">Tablet · 768 × 1024</button><button data-size="1280,720" aria-pressed="false">TV browser · 1280 × 720</button><button id="companion">Show phone companion</button></div><p id="lab-status" role="status">Phone viewport · 360 × 800</p><div class="lab-frame"><iframe id="preview" title="CouchPilot responsive viewport" width="360" height="800" src="./index.html" loading="eager"></iframe></div><a href="./">Return to CouchPilot →</a></main><script>const frame=document.getElementById('preview'),status=document.getElementById('lab-status');for(const b of document.querySelectorAll('[data-size]'))b.addEventListener('click',()=>{const [w,h]=b.dataset.size.split(',');frame.width=w;frame.height=h;frame.src='./index.html';for(const x of document.querySelectorAll('[data-size]'))x.setAttribute('aria-pressed',String(x===b));status.textContent=b.textContent;});document.getElementById('companion').addEventListener('click',()=>{frame.width=360;frame.height=800;frame.src='./companion.html#segment=assignment';status.textContent='Phone companion viewport · 360 × 800';for(const x of document.querySelectorAll('[data-size]'))x.setAttribute('aria-pressed','false');});</script></body></html>
