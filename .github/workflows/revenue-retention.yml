name: Revenue retention evidence
on: [push, pull_request]
jobs:
  reproduce:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/revenue-retention
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest -v test_revenue_analysis.py test_advanced.py test_robustness.py
      - run: node --test test_engine.js
      - run: python build.py
      - run: python advanced.py --output data/advanced-examples.json
      - run: python robustness.py
      - run: git diff --exit-code -- data
