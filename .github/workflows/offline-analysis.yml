name: Reproducible analysis
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python analysis/build.py
      - run: python analysis/business_case.py
      - run: python analysis/product.py analysis/events.synthetic.jsonl
      - run: python analysis/test_decision_lab.py
      - run: python analysis/decision_lab.py
      - run: python analysis/test_assurance.py
      - run: python analysis/assurance.py
      - run: python projects/commerce-conversion/tests/test_analysis.py
      - run: node --test projects/commerce-conversion/tests/*.test.cjs
      - run: python projects/commerce-conversion/analyze.py
      - run: python projects/commerce-conversion/build_site.py
      - run: node projects/commerce-conversion/experiment/build.cjs
      - run: python projects/commerce-conversion/reporting/test_reporting.py
      - run: python projects/commerce-conversion/reporting/build.py
      - run: python projects/commerce-conversion/reporting/verify.py
      - run: python projects/commerce-conversion/build_readout.py
      - run: git diff --exit-code -- projects/commerce-conversion/reporting/output projects/commerce-conversion/readout.html
      - run: python analysis/build_evidence.py
      - run: python projects/commerce-conversion/operations/test_pipeline.py
      - run: python projects/commerce-conversion/operations/build_demo.py
      - run: git diff --exit-code -- projects/commerce-conversion/operations/demo.json projects/commerce-conversion/operations/demo-data.js projects/commerce-conversion/operations/baseline.json
      - run: git diff --exit-code -- analysis/output projects/commerce-conversion/output projects/commerce-conversion/data.js projects/commerce-conversion/data/provenance.json projects/commerce-conversion/experiment/readouts.json
