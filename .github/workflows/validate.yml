name: Offline validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.cjs
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - run: python analysis/site_audit.py
      # gh-pages is a static deployment snapshot, not the complete analysis source.
      # Keep its tool tests and all-page link audit above; rebuild analysis on source branches.
      - if: github.ref != 'refs/heads/gh-pages'
        run: python analysis/product.py analysis/events.synthetic.jsonl

      - run: python tools/event-audit/assurance/verify.py
      - run: python tools/event-audit/assurance/build.py
      - run: git diff --exit-code -- tools/event-audit/assurance/results.json tools/event-audit/assurance/index.html
