<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Portfolio responsive verification</title><style>
*{box-sizing:border-box}body{margin:0;background:#e9ede9;color:#173e39;font:14px/1.5 system-ui}header{padding:16px 24px;background:white;border-bottom:1px solid #bac6bc}h1{font-size:20px;margin:0 0 6px}p{margin:6px 0}label{display:inline-flex;gap:8px;align-items:center;margin:8px 14px 8px 0}select,button{font:inherit;padding:9px;border:1px solid #8a9f94;border-radius:4px;background:white;color:inherit;min-height:44px}button{cursor:pointer}main{padding:24px;overflow:auto}iframe{display:block;width:390px;height:780px;border:0;outline:1px solid #8a9f94;background:white;border-radius:8px;margin:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:180px;overflow:auto}details{max-width:900px;margin:auto;padding:12px}button:focus-visible,select:focus-visible{outline:3px solid #216557;outline-offset:3px}
</style></head><body><header><h1>Responsive verification · actual portfolio</h1><p>Fixed-width browser viewports. This does not emulate a phone OS, touch input or GPU.</p><label>Viewport width<select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option></select></label><label>Section<select id="section"><option value="">Introduction</option><option value="work">Selected work</option><option value="guide">Workbench</option><option value="ai-assistant">AI lab</option><option value="experience">Experience</option></select></label><button id="measure">Measure visible layout</button><output id="status" aria-live="polite"></output></header><main><iframe id="preview" src="/" title="Live portfolio at selected viewport width"></iframe></main><details><summary>Layout measurements</summary><pre id="report">Choose Measure visible layout after a section loads.</pre></details><script>
const frame=document.getElementById('preview');
document.getElementById('width').addEventListener('change',e=>{frame.style.width=e.target.value+'px';document.getElementById('status').textContent='Viewport set to '+e.target.value+' CSS pixels.';});
document.getElementById('section').addEventListener('change',e=>{const target=e.target.value?frame.contentDocument.getElementById(e.target.value):frame.contentDocument.body;target.scrollIntoView({behavior:'instant',block:'start'});});
document.getElementById('measure').addEventListener('click',()=>{const d=frame.contentDocument,w=d.documentElement.clientWidth;const overflow=[...d.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&r.right>w+1&&getComputedStyle(e).position!=='absolute';}).slice(0,20).map(e=>({element:e.tagName.toLowerCase(),id:e.id,class:e.className,right:Math.round(e.getBoundingClientRect().right)}));const result={viewport:frame.contentWindow.innerWidth,contentWidth:w,documentWidth:d.documentElement.scrollWidth,horizontalOverflow:d.documentElement.scrollWidth>w,overflow};document.getElementById('report').textContent=JSON.stringify(result,null,2);document.getElementById('status').textContent=w+'px: '+(result.horizontalOverflow?'horizontal overflow detected':'no document overflow');});
</script></body></html>
